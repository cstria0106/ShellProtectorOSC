[package]
name = "ShellProtectorOSC"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.97"
crossbeam = "0.8.4"
crossbeam-channel = "0.5.14"
eframe = "0.31.1"
image = "0.25.5"
rosc = "0.11.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
tokio = { version = "1.44.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
] }
tray-icon = "0.20.0"
