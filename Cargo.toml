[package]
name = "ShellProtectorOSC"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.97"
crossbeam-channel = "0.5.14"
eframe = "0.31.1"
rosc = "0.11.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
tokio = { version = "1.44.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
] }
tray-icon = "0.20.0"
windows = { version = "0.61.1", features = ["Win32_System", "Win32_System_Threading", "Win32_UI", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = true
panic = "abort"
